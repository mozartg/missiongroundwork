schema_version: 1
process_id: MCLP-001
project_id: mission-groundwork
project_name: Mission GroundWork
repository: mozartg/missiongroundwork
product_promise: >-
  Help nonprofit and mission-driven teams start complex work on solid ground
  before wasted effort, confused ownership, and preventable rework set in.
primary_audiences:
  - nonprofit_executive_directors
  - nonprofit_chiefs_of_staff
  - development_and_fundraising_leaders
  - program_and_operations_leaders
  - small_mission_driven_teams_starting_complex_work
primary_conversion_action: request_a_groundwork_session
service_lanes:
  - executive_groundwork
  - development_groundwork
  - program_groundwork
  - communications_groundwork
  - operations_groundwork
visual_direction:
  - grounded
  - warm
  - credible
  - spacious
  - premium_without_corporate_distance
  - evidence_before_claims
  - clear_lanes_not_generic_consulting_menu
  - contextual_human_photography_or_illustration_only
brand:
  foundation_green: '#2E5E4E'
  warm_stone: '#D9CDBA'
  slate: '#39434D'
  off_white: '#F7F5F2'
  muted_clay: '#A86E4A'
claim_boundaries:
  - no_invented_clients_testimonials_demand_or_results
  - measurable_claims_require_source_or_case_evidence
  - contextual_photography_is_not_client_evidence
  - private_relationships_and_organizations_must_be_protected
  - availability_and_response_times_must_not_be_invented
  - direct_cta_requires_a_working_destination
approval:
  final_owner_review_required: true
  publishing_authorized: false

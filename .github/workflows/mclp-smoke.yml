name: MCLP Distribution Smoke
on:
  pull_request:
    paths: ['.media/**', '.github/workflows/mclp-smoke.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python .media/smoke-test.py

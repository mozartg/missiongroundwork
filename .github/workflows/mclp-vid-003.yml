name: MCLP VID-003 ownership visual essay

on:
  pull_request:
    paths:
      - 'media/jobs/VID-003-ownership-visual-essay.json'
      - 'scripts/render_mclp_vid_003.py'
      - '.github/workflows/mclp-vid-003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify hosted tools and install bounded renderer dependency
        run: |
          set -euo pipefail
          python3 --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Validate structured job and script
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/render_mclp_vid_003.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          job = json.loads(Path('media/jobs/VID-003-ownership-visual-essay.json').read_text(encoding='utf-8'))
          assert job['process_id'] == 'MCLP-001'
          assert job['artifact_id'] == 'VID-003'
          assert job['revision'] == 1
          assert job['project_id'] == 'mission-groundwork'
          assert job['production_method'] == 'deterministic_multi_scene_editorial_video'
          assert job['format'] == {'width': 1080, 'height': 1920, 'fps': 24, 'duration_seconds': 15, 'audio': False}
          assert len(job['scenes']) == 5
          assert len({scene['construction'] for scene in job['scenes']}) == 5
          assert job['source_photo']['expected_sha1'] == '0f96478e2ed2b605542bcde64ed7294c122fb115'
          assert job['publishing_authorized'] is False
          assert job['paid_service_authorized'] is False
          requirements = ' '.join(job['quality_requirements']).lower()
          assert 'must not be a single static image loop' in requirements
          assert 'at least three visually distinct scene constructions' in requirements
          assert 'not be presented as a client' in requirements
          print('VID-003 structured job: PASS')
          PY

      - name: Render visual essay
        run: python3 scripts/render_mclp_vid_003.py

      - name: Validate video, storyboard, and receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          from PIL import Image

          root = Path('artifacts/mclp/VID-003')
          video = root / 'VID-003-ownership-visual-essay.mp4'
          storyboard = root / 'storyboard-contact-sheet.png'
          receipt = json.loads((root / 'render-receipt.json').read_text(encoding='utf-8'))
          assert video.is_file() and video.stat().st_size > 200_000
          assert storyboard.is_file() and storyboard.stat().st_size > 50_000
          assert len(list((root / 'representative-scenes').glob('scene-*.png'))) == 5
          with Image.open(storyboard) as image:
              assert image.format == 'PNG'
              assert image.size == (1350, 480)
          probe = json.loads(subprocess.run([
              'ffprobe', '-v', 'error',
              '-show_entries', 'format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,pix_fmt',
              '-of', 'json', str(video)
          ], capture_output=True, text=True, check=True).stdout)
          video_streams = [s for s in probe['streams'] if s.get('codec_type') == 'video']
          audio_streams = [s for s in probe['streams'] if s.get('codec_type') == 'audio']
          assert len(video_streams) == 1 and not audio_streams
          stream = video_streams[0]
          assert int(stream['width']) == 1080 and int(stream['height']) == 1920
          assert 14.8 <= float(probe['format']['duration']) <= 15.2
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          assert receipt['status'] == 'PASS_TECHNICAL'
          assert receipt['terminal_state'] == 'USER_REVIEW_REQUIRED'
          assert receipt['scene_count'] == 5
          assert receipt['distinct_scene_constructions'] == 5
          assert receipt['single_static_image_loop'] is False
          assert receipt['output']['sha256'] == digest
          assert receipt['output']['audio_streams'] == 0
          assert receipt['publishing_authorized'] is False
          assert receipt['paid_service_used'] is False
          print(json.dumps(receipt, indent=2))
          PY

      - name: Publish run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## MCLP VID-003

          - Project: Mission GroundWork
          - Lane: deterministic multi-scene editorial short video
          - Scenes: 5 purposeful constructions
          - Duration: 15 seconds
          - Format: 1080×1920, 24 fps, silent
          - Single static image loop: no
          - State: technical pass; creative review required
          - Publishing: disabled
          - Paid services: none
          MD
          cat artifacts/mclp/VID-003/render-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mclp-vid-003-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mclp/VID-003
          if-no-files-found: error
          retention-days: 30

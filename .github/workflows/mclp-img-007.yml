name: MCLP IMG-007 shared direction editorial

on:
  pull_request:
    paths:
      - 'media/jobs/IMG-007-shared-direction.json'
      - 'scripts/render_mclp_img_007.py'
      - '.github/workflows/mclp-img-007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify hosted Python and install bounded renderer dependency
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0

      - name: Validate structured job and script
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/render_mclp_img_007.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          job = json.loads(Path('media/jobs/IMG-007-shared-direction.json').read_text(encoding='utf-8'))
          assert job['process_id'] == 'MCLP-001'
          assert job['artifact_id'] == 'IMG-007'
          assert job['revision'] == 1
          assert job['project_id'] == 'mission-groundwork'
          assert job['production_method'] == 'deterministic_alignment_editorial_composition'
          assert job['publishing_authorized'] is False
          assert job['paid_service_authorized'] is False
          assert job['source_photo']['license'].startswith('Public domain')
          assert job['source_photo']['expected_sha1'] == '6465cb3f5dfbbb4a091973012a84632ed5951161'
          assert job['source_photo']['expected_bytes'] == 192143
          assert job['layout_contract']['distinct_from_IMG_004'] is True
          assert job['layout_contract']['text_photo_overlap'] is False
          assert 'no dashboard cards or metric tiles' in job['layout_contract']['closing_rule']
          truth = ' '.join(job['truth_boundaries']).lower()
          assert 'not a mission groundwork client' in truth
          assert 'not identified as users' in truth
          assert 'no result' in truth
          assert 'editorial analogy' in truth
          print('IMG-007 structured job: PASS')
          PY

      - name: Render editorial image
        run: python3 scripts/render_mclp_img_007.py

      - name: Validate output and receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('artifacts/mclp/IMG-007')
          output = root / 'IMG-007-shared-direction.png'
          receipt = json.loads((root / 'render-receipt.json').read_text(encoding='utf-8'))
          assert output.is_file() and output.stat().st_size > 100_000
          with Image.open(output) as image:
              assert image.format == 'PNG'
              assert image.size == (1080, 1350)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          assert receipt['status'] == 'PASS_TECHNICAL'
          assert receipt['terminal_state'] == 'USER_REVIEW_REQUIRED'
          assert receipt['output']['sha256'] == digest
          assert receipt['source']['sha1'] == '6465cb3f5dfbbb4a091973012a84632ed5951161'
          assert receipt['family_test']['prior_artifact'] == 'IMG-004'
          assert receipt['family_test']['distinct_source'] is True
          assert receipt['family_test']['distinct_composition'] is True
          assert receipt['layout_checks']['text_photo_overlap'] is False
          assert receipt['layout_checks']['dashboard_cards_or_metric_tiles'] is False
          assert receipt['publishing_authorized'] is False
          assert receipt['paid_service_used'] is False
          print(json.dumps(receipt, indent=2))
          PY

      - name: Publish run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## MCLP IMG-007

          - Project: Mission GroundWork
          - Phase: 4 — Deterministic Image Mastery
          - Test: second distinct within-project editorial concept
          - Source: pinned USAID public-domain participatory planning photograph
          - State: technical pass; creative and project-owner review required
          - Dashboard or metric-card construction: prohibited
          - Publishing: disabled
          - Paid services: none
          MD
          cat artifacts/mclp/IMG-007/render-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mclp-img-007-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mclp/IMG-007
          if-no-files-found: error
          retention-days: 30

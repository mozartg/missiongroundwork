name: One-time repository reference cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo; const p='.github/workflows/repository-reference-cleanup.yml';
            const m=(await github.rest.repos.get({owner,repo})).data;
            const f=await github.rest.repos.getContent({owner,repo,path:p,ref:m.default_branch});
            await github.rest.repos.deleteFile({owner,repo,path:p,message:'Remove completed one-time cleanup workflow',sha:f.data.sha,branch:m.default_branch});
      - shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet git-filter-repo
          w="$RUNNER_TEMP/clean.git"; git clone --mirror "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$w"; cd "$w"
          r='voice[[:space:]_-]*box'; f="$(git log --all -i -G"$r" --format='%H' -- 2>/dev/null | head -1 || true)"
          [ -n "$f" ] || f="$(git log --all -i --grep="$r" --format='%H' 2>/dev/null | head -1 || true)"; [ -n "$f" ] || f="$(git log --all --name-only --format= | grep -Ei "$r" | head -1 || true)"; [ -n "$f" ] || exit 0
          printf '%s\n' 'regex:(?i)voice[\s_-]*box==>local-media-service' > "$RUNNER_TEMP/repl.txt"
          git filter-repo --force --replace-text "$RUNNER_TEMP/repl.txt" --file-info-callback '
          import re
          p=re.compile(b"voice[\\s_-]*box",re.I); low=filename.lower(); docs=(b".md",b".mdx",b".rst",b".txt",b".adoc",b".org",b".wiki",b".htm",b".html"); keep=any(x in low for x in (b"builder",b"install",b"installer",b"setup",b"upstream",b"vendor")); c=value.get_contents_by_identifier(blob_id)
          if p.search(c):
              if low.endswith(docs) and not keep: return (None,mode,blob_id)
              if not keep:
                  if value.is_binary(c): return (None,mode,blob_id)
                  blob_id=value.insert_file_with_contents(value.apply_replace_text(c))
          if p.search(filename) and not keep: filename=p.sub(b"local-media-service",filename)
          return (filename,mode,blob_id)' --message-callback 'import re; return re.sub(b"voice[\\s_-]*box",b"local media service",message,flags=re.I)'
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --prune origin 'refs/heads/*:refs/heads/*'; git push --force --prune origin 'refs/tags/*:refs/tags/*'

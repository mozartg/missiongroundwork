name: MCLP media pack smoke test

on:
  pull_request:
    paths:
      - '.media/**'
      - 'media/jobs/**'
      - 'scripts/render_mclp_img_004.py'
      - '.github/workflows/media-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-media-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate local MCLP access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = [
              '.media/README.md',
              '.media/process.json',
              '.media/project-profile.yaml',
              '.media/quality-profile.yaml',
              '.media/toolchain.lock.json',
              '.media/output-index.json',
              'media/jobs/IMG-004-ownership-is-fuzzy.json',
              'scripts/render_mclp_img_004.py',
              '.github/workflows/mclp-img-004.yml',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          assert not missing, missing

          process = json.loads(Path('.media/process.json').read_text(encoding='utf-8'))
          output_index = json.loads(Path('.media/output-index.json').read_text(encoding='utf-8'))
          toolchain = json.loads(Path('.media/toolchain.lock.json').read_text(encoding='utf-8'))
          job = json.loads(Path('media/jobs/IMG-004-ownership-is-fuzzy.json').read_text(encoding='utf-8'))

          assert process['process_id'] == 'MCLP-001'
          assert process['project_id'] == 'mission-groundwork'
          assert process['publishing_authorized'] is False
          assert process['paid_service_authorized'] is False
          assert output_index['project_id'] == 'mission-groundwork'
          assert output_index['outputs'][0]['artifact_id'] == 'IMG-004'
          assert output_index['outputs'][0]['publishing_authorized'] is False
          assert toolchain['paid_service_authorized'] is False
          assert job['process_id'] == 'MCLP-001'
          assert job['project_id'] == 'mission-groundwork'
          assert job['publishing_authorized'] is False
          assert job['paid_service_authorized'] is False

          project_profile = Path('.media/project-profile.yaml').read_text(encoding='utf-8')
          quality_profile = Path('.media/quality-profile.yaml').read_text(encoding='utf-8')
          assert 'project_id: mission-groundwork' in project_profile
          assert 'final_owner_review_required: true' in project_profile
          assert 'technical_pass_used_as_creative_approval' in quality_profile
          assert 'Your Pay 12.5 330 dashboard asset' in quality_profile
          print('Mission GroundWork MCLP media pack: PASS')
          PY

      - name: Summarize
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Mission GroundWork MCLP media pack

          - Process: MCLP-001
          - Project authority: Mission GroundWork repository
          - Current canary: IMG-004
          - Local media pack: present and internally consistent
          - Publishing: disabled
          - Paid services: none
          MD
